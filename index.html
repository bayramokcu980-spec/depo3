
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dünya Fetih Stratejisi</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
body{margin:0;background:#111827;color:white;font-family:Arial}
header{padding:14px;background:#1f2937;text-align:center}
#stats{display:flex;justify-content:space-around;gap:8px;padding:12px;flex-wrap:wrap}
button{padding:10px;border:0;border-radius:6px;background:#2563eb;color:white;font-weight:bold}
button:disabled{opacity:.4}
#map{height:62vh;width:100%;background:#172033}
#panel{padding:14px;background:#1f2937}
#message{color:#fbbf24}
</style>
</head>
<body>
<header><h2>🌍 Dünya Fetih Stratejisi</h2></header>
<div id="stats">
<span>💰 Altın: <b id="gold">1000</b></span>
<span>🪖 Ordu: <b id="army">50000</b></span>
<span>🏙️ Ülke: <b id="country">Türkiye</b></span>
<span>📅 Tur: <b id="turn">1</b></span>
</div>
<div id="map"></div>
<div id="panel">
<p>Seçilen ülke: <b id="selected">Türkiye</b></p>
<button onclick="recruit()">Ordu kur (300 altın)</button>
<button onclick="attack()">Saldır</button>
<button onclick="ally()">İttifak kur (200 altın)</button>
<button onclick="nextTurn()">Sonraki tur</button>
<p id="message">Haritadan bir ülke seç.</p>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([30,20],2);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
 attribution:'© OpenStreetMap'
}).addTo(map);

let gold=1000, army=50000, turn=1;
let home='Turkey', selected='Turkey';
let owned=new Set(['Turkey']);
let allies=new Set();
let armies={'Turkey':50000};
let layers={};

const trNames={
'Turkey':'Türkiye','Türkiye':'Türkiye',
'United States of America':'ABD',
'Russian Federation':'Rusya','Russia':'Rusya',
'China':'Çin','Iran':'İran','Iraq':'Irak',
'Greece':'Yunanistan','Bulgaria':'Bulgaristan',
'Syria':'Suriye','Georgia':'Gürcistan',
'Ukraine':'Ukrayna','France':'Fransa',
'Germany':'Almanya','United Kingdom':'Birleşik Krallık',
'India':'Hindistan','Japan':'Japonya',
'Brazil':'Brezilya','Egypt':'Mısır',
'Saudi Arabia':'Suudi Arabistan','Italy':'İtalya',
'Spain':'İspanya','Pakistan':'Pakistan',
'Afghanistan':'Afganistan','Armenia':'Ermenistan',
'Azerbaijan':'Azerbaycan','Israel':'İsrail',
'Jordan':'Ürdün','Lebanon':'Lübnan'
};

function displayName(name){return trNames[name]||name}
function color(name){
 if(owned.has(name)) return '#16a34a';
 if(allies.has(name)) return '#2563eb';
 return '#64748b';
}
function styleFeature(feature){
 const name=feature.properties.ADMIN||feature.properties.name;
 return {color:'#d1d5db',weight:.7,fillColor:color(name),fillOpacity:.75};
}
function updateMap(){
 Object.entries(layers).forEach(([name,layer])=>{
   layer.setStyle({fillColor:color(name)});
 });
}
function selectCountry(name){
 selected=name;
 document.getElementById('selected').textContent=displayName(name);
}
function update(){
 document.getElementById('gold').textContent=gold.toLocaleString('tr-TR');
 document.getElementById('army').textContent=army.toLocaleString('tr-TR');
 document.getElementById('country').textContent=displayName(home);
 document.getElementById('turn').textContent=turn;
 updateMap();
}
fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson')
.then(r=>r.json())
.then(data=>{
 L.geoJSON(data,{
   style:styleFeature,
   onEachFeature:(feature,layer)=>{
     const name=feature.properties.ADMIN||feature.properties.name;
     layers[name]=layer;
     layer.bindTooltip(displayName(name));
     layer.on('click',()=>selectCountry(name));
   }
 }).addTo(map);
})
.catch(()=>document.getElementById('message').textContent=
 'Harita yüklenemedi. İnternet bağlantını kontrol et.');

function recruit(){
 if(gold<300){msg('Yeterli altının yok.');return}
 gold-=300;
 const amount=10000;
 army+=amount;
 armies[home]=(armies[home]||0)+amount;
 update();msg('10.000 asker toplandı.');
}
function attack(){
 if(selected===home||owned.has(selected)){msg('Kendi ülkene saldıramazsın.');return}
 if(allies.has(selected)){msg('Müttefikine saldıramazsın.');return}
 if(army<5000){msg('Saldırı için en az 5.000 asker gerekli.');return}
 const defender=armies[selected]||Math.floor(10000+Math.random()*40000);
 const attackers=army;
 const attackerLoss=Math.min(army,Math.floor(defender*(.25+Math.random()*.35)));
 const defenderLoss=Math.min(defender,Math.floor(attackers*(.35+Math.random()*.35)));
 army=Math.max(0,army-attackerLoss);
 armies[home]=army;
 armies[selected]=Math.max(0,defender-defenderLoss);
 if(armies[selected]===0){
   owned.add(selected);
   home=selected;
   army=Math.max(0,army);
   gold+=500;
   msg(displayName(selected)+' fethedildi! +500 altın.');
 }else{
   msg('Savaş bitti. Senin kaybın: '+attackerLoss.toLocaleString('tr-TR')+
       ', düşman kaybı: '+defenderLoss.toLocaleString('tr-TR')+'.');
 }
 update();
}
function ally(){
 if(owned.has(selected)){msg('Bu ülke zaten senin.');return}
 if(gold<200){msg('İttifak için 200 altın gerekli.');return}
 gold-=200;allies.add(selected);update();
 msg(displayName(selected)+' ile ittifak kuruldu.');
}
function nextTurn(){
 turn++;
 gold+=owned.size*250;
 army+=owned.size*1000;
 armies[home]=army;
 update();
 msg('Yeni tur başladı. Ülkelerinden vergi ve asker geliri kazandın.');
}
function msg(text){document.getElementById('message').textContent=text}
update();
</script>
</body>
</html>
