<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticarisk & Benzinlik Simülasyonu PRO</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --accent-orange: #f97316;
            --accent-green: #22c55e;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
        }

        /* --- GİRİŞ / KAYIT EKRANI --- */
        #auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.98)),
                        url('https://images.unsplash.com/photo-1527018606416-a674e1780742?auto=format&fit=crop&w=1200&q=80') center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .auth-card {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px;
            width: 380px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .auth-card h1 {
            color: var(--accent-orange);
            margin-bottom: 8px;
            font-size: 26px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .auth-card p {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(15, 23, 42, 0.8);
            color: #fff;
            outline: none;
            font-size: 14px;
        }

        .auth-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, var(--accent-orange), #ea580c);
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(249, 115, 22, 0.4);
        }

        /* --- OYUN ANA DÜZENİ --- */
        #game-layout {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* TOP BAR */
        .top-bar {
            background: rgba(30, 41, 59, 0.95);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
        }

        .brand {
            font-size: 20px;
            font-weight: 800;
            color: var(--accent-orange);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stats-container {
            display: flex;
            gap: 20px;
        }

        .stat-box {
            background: rgba(15, 23, 42, 0.6);
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .stat-box .label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .stat-box .value {
            font-size: 14px;
            font-weight: bold;
            color: var(--text-main);
        }

        .val-green { color: var(--accent-green) !important; }
        .val-orange { color: var(--accent-orange) !important; }
        .val-red { color: var(--accent-red) !important; }

        /* MAIN CONTENT AREA */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* NAVIGATION SIDEBAR */
        .sidebar {
            width: 220px;
            background: rgba(30, 41, 59, 0.7);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            padding: 15px 10px;
            gap: 8px;
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 12px 16px;
            border-radius: 10px;
            text-align: left;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        .nav-btn.active {
            background: var(--accent-orange);
            color: white;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3);
        }

        /* VIEW PANELS */
        .content-area {
            flex: 1;
            position: relative;
            background: #020617;
            overflow-y: auto;
        }

        .tab-panel {
            display: none;
            height: 100%;
            padding: 20px;
        }

        .tab-panel.active {
            display: flex;
            flex-direction: column;
        }

        /* SAHA CANLI İSTASYON CANVAS */
        #station-canvas {
            width: 100%;
            height: 100%;
            border-radius: 12px;
            background: #1e293b;
        }

        /* BORSA & RİSK PANELS */
        .grid-2 {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            height: 100%;
        }

        .card {
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card h2 {
            font-size: 16px;
            color: var(--accent-orange);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 10px;
        }

        /* CRISIS BANNER */
        .crisis-banner {
            background: linear-gradient(90deg, #7f1d1d, #ef4444);
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.9; }
            50% { opacity: 1; filter: brightness(1.2); }
            100% { opacity: 0.9; }
        }

        /* TANKER SİPARİŞ LİSTESİ */
        .fuel-order-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.6);
            padding: 12px;
            border-radius: 8px;
        }

        .action-btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .action-btn:hover {
            filter: brightness(1.2);
        }

        /* DEV TOOLBAR */
        #dev-toolbar {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #000;
            border: 2px solid #22c55e;
            padding: 10px 15px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
            z-index: 1000;
        }

        #dev-toolbar h4 {
            color: #22c55e;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .dev-btn {
            background: #15803d;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            margin-right: 5px;
        }

        /* CHAT */
        .chat-box {
            flex: 1;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 8px;
            padding: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 400px;
        }

        .chat-msg {
            font-size: 12px;
            line-height: 1.4;
        }

        .chat-msg .user {
            color: var(--accent-orange);
            font-weight: bold;
        }

        .chat-input-group {
            display: flex;
            gap: 10px;
        }

        .chat-input-group input {
            flex: 1;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #0f172a;
            color: white;
        }
    </style>
</head>
<body>

        <div class="auth-card">

                <label>Kullanıcı Adı</label>
                <input type="text" id="username" placeholder="Örn: Bayram" value="Bayram">
            </div>
            <div class="input-group">
