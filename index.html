<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticarisk - Şirket Simülasyonu</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h1, h2 {
            text-align: center;
            color: #00e676;
        }
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
        }
        .stat-box {
            text-align: center;
        }
        .stat-value {
            font-size: 1.4em;
            font-weight: bold;
            color: #ffeb3b;
        }
        .market-panel, .actions-panel {
            background: #252525;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        button {
            background-color: #00e676;
            color: #121212;
            border: none;
            padding: 10px 18px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
            transition: 0.2s;
        }
        button:hover {
            background-color: #00b359;
        }
        .btn-danger {
            background-color: #ff5252;
            color: white;
        }
        .btn-danger:hover {
            background-color: #d32f2f;
        }
        #log-area {
            background: #000;
            color: #00ff66;
            font-family: monospace;
            padding: 10px;
            height: 120px;
            overflow-y: auto;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>💼 TICARISK SIMÜLATÖRÜ</h1>
    
    <div class="dashboard">
        <div class="stat-box">Ay: <div class="stat-value" id="month">1</div></div>
        <div class="stat-box">Kasa: <div class="stat-value" id="cash">500.000 TL</div></div>
        <div class="stat-box">Çelik Depo: <div class="stat-value" id="inventory">0 Birim</div></div>
        <div class="stat-box">Tır Sayısı: <div class="stat-value" id="trucks">0</div></div>
    </div>

    <div class="market-panel">
        <h2>📈 Piyasa Fiyatları</h2>
        <p>Çelik Alış/Satış Fiyatı: <strong id="steel-price" style="color:#00e676">100 TL</strong> / Birim</p>
    </div>

    <div class="actions-panel">
        <h2>🕹️ Hamleler</h2>
        <button onclick="buySteel()">100 Birim Çelik Al (10.000 TL)</button>
        <button onclick="sellSteel()">100 Birim Çelik Sat</button>
        <button onclick="buyTruck()">Lojistik Tırı Al (200.000 TL)</button>
        <button class="btn-danger" onclick="nextMonth()">Aylık Turu Bitir ➔</button>
    </div>

    <h2>📜 Bildirimler & Olaylar</h2>
    <div id="log-area">Piyasaya hoş geldin! İlk hamleni seç...</div>
</div>

<script>
    let cash = 500000;
    let month = 1;
    let inventory = 0;
    let trucks = 0;
    let steelPrice = 100;

    function updateUI() {
        document.getElementById('cash').innerText = cash.toLocaleString() + ' TL';
        document.getElementById('month').innerText = month;
        document.getElementById('inventory').innerText = inventory + ' Birim';
        document.getElementById('trucks').innerText = trucks;
        document.getElementById('steel-price').innerText = steelPrice + ' TL';
    }

    function log(msg) {
        const logArea = document.getElementById('log-area');
        logArea.innerHTML = `> Ay ${month}: ${msg}<br>` + logArea.innerHTML;
    }

    function buySteel() {
        let cost = steelPrice * 100;
        if (cash >= cost) {
            cash -= cost;
            inventory += 100;
            log(`100 birim Çelik alındı (${cost.toLocaleString()} TL).`);
            updateUI();
        } else {
            alert('Kasalarda yeterli para yok!');
        }
    }

    function sellSteel() {
        if (inventory >= 100) {
            let revenue = steelPrice * 100;
            cash += revenue;
            inventory -= 100;
            log(`100 birim Çelik satıldı (${revenue.toLocaleString()} TL).`);
            updateUI();
        } else {
            alert('Depoda yeterli çelik yok!');
        }
    }

    function buyTruck() {
        if (cash >= 200000) {
            cash -= 200000;
            trucks += 1;
            log('1 adet Lojistik Tırı satın alındı!');
            updateUI();
        } else {
            alert('Tır almak için 200.000 TL gerekiyor!');
        }
    }

    function nextMonth() {
        month++;
        
        // Sabit Giderler
        let expense = 15000;
        cash -= expense;

        // Tır Gelirleri
        let truckIncome = trucks * 30000;
        cash += truckIncome;

        // Fiyat Dalgalanması (%-30 ile %+40 arası)
        let changePercent = (Math.random() * 0.7) - 0.3;
        steelPrice = Math.max(30, Math.round(steelPrice * (1 + changePercent)));

        log(`Ay tamamlandı. Sabit gider: -15.000 TL | Tır Geliri: +${truckIncome.toLocaleString()} TL | Yeni Çelik Fiyatı: ${steelPrice} TL`);
        
        if (cash < 0) {
            alert('İflas ettin! Oyunu baştan başlatıyoruz.');
            location.reload();
        }

        updateUI();
    }
</script>

</body>
</html>
